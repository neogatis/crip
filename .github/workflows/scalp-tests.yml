name: S-Scalp paper tests
on:
  push:
    branches:
      - feature/s-scalp-paper-mvp
    paths:
      - 's_scalp/**'
      - '.github/workflows/scalp-tests.yml'
  pull_request:
    paths:
      - 's_scalp/**'
      - '.github/workflows/scalp-tests.yml'
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r s_scalp/requirements.txt
      - run: cd s_scalp && python -m unittest discover -s tests -v
